services:
  - type: web
    name: pizza-shop
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_VERSION
        value: 18.20.0
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
